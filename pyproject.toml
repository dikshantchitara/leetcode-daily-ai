[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "leetcode-daily-ai"
version = "0.1.0"
description = "Generate and validate LeetCode daily challenge solutions for review."
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3",
]

[project.scripts]
daily-solver = "daily_solver.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]